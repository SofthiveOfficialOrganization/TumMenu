name: IIS Smoke Test

on:
  workflow_dispatch:
    inputs:
      content:
        description: "Text to write into smoke.txt"
        required: false
        default: "TumMenu IIS smoke test"
        type: string

concurrency:
  group: iis-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke test IIS file write and app pool restart
    runs-on:
      - self-hosted
      - windows

    env:
      # GitHub Secrets examples:
      # IIS_SITE_PATH: C:\inetpub\wwwroot\<example-site>
      # IIS_APP_POOL_NAME: <example-app-pool>
      # IIS_SMOKE_URL: https://<example-domain>/smoke.txt
      IIS_SITE_PATH: ${{ secrets.IIS_SITE_PATH }}
      IIS_APP_POOL_NAME: ${{ secrets.IIS_APP_POOL_NAME }}
      IIS_SMOKE_URL: ${{ secrets.IIS_SMOKE_URL }}
      SMOKE_CONTENT: ${{ inputs.content }}

    steps:
      - name: Write and update smoke.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:IIS_SITE_PATH)) {
            throw "Missing IIS_SITE_PATH secret. Example: C:\inetpub\wwwroot\<example-site>"
          }

          if (-not (Test-Path -LiteralPath $env:IIS_SITE_PATH)) {
            throw "IIS site path was not found: $env:IIS_SITE_PATH"
          }

          $smokePath = Join-Path $env:IIS_SITE_PATH "smoke.txt"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $firstUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $initialContent = @"
          TumMenu IIS smoke test
          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Run: $runUrl
          First write UTC: $firstUtc
          Content: $env:SMOKE_CONTENT
          State: created
          "@

          Set-Content -LiteralPath $smokePath -Value $initialContent -Encoding UTF8

          if (-not (Test-Path -LiteralPath $smokePath)) {
            throw "smoke.txt was not created: $smokePath"
          }

          $updateUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $updatedContent = @"
          TumMenu IIS smoke test
          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Run: $runUrl
          First write UTC: $firstUtc
          Updated UTC: $updateUtc
          Content: $env:SMOKE_CONTENT
          State: updated
          "@

          Set-Content -LiteralPath $smokePath -Value $updatedContent -Encoding UTF8

          $writtenContent = Get-Content -LiteralPath $smokePath -Raw
          if ($writtenContent -notlike "*State: updated*") {
            throw "smoke.txt update verification failed."
          }

          "smoke.txt was created and updated successfully at: $smokePath"

      - name: Stop and start IIS app pool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:IIS_APP_POOL_NAME)) {
            throw "Missing IIS_APP_POOL_NAME secret. Example: <example-app-pool>"
          }

          Import-Module WebAdministration

          function Wait-AppPoolState {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Name,
              [Parameter(Mandatory = $true)]
              [string] $ExpectedState,
              [int] $TimeoutSeconds = 30
            )

            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            do {
              $state = (Get-WebAppPoolState -Name $Name).Value
              if ($state -eq $ExpectedState) {
                return
              }

              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)

            $currentState = (Get-WebAppPoolState -Name $Name).Value
            throw "App Pool '$Name' did not reach '$ExpectedState' state. Current state: '$currentState'."
          }

          $initialState = (Get-WebAppPoolState -Name $env:IIS_APP_POOL_NAME).Value
          "Initial App Pool state: $initialState"

          try {
            if ($initialState -ne "Stopped") {
              Stop-WebAppPool -Name $env:IIS_APP_POOL_NAME
              Wait-AppPoolState -Name $env:IIS_APP_POOL_NAME -ExpectedState "Stopped"
            }

            Start-WebAppPool -Name $env:IIS_APP_POOL_NAME
            Wait-AppPoolState -Name $env:IIS_APP_POOL_NAME -ExpectedState "Started"

            "App Pool stop/start smoke test completed successfully."
          }
          finally {
            $finalState = (Get-WebAppPoolState -Name $env:IIS_APP_POOL_NAME).Value
            if ($finalState -ne "Started") {
              Start-WebAppPool -Name $env:IIS_APP_POOL_NAME
              Wait-AppPoolState -Name $env:IIS_APP_POOL_NAME -ExpectedState "Started"
            }
          }

      - name: Verify smoke.txt over HTTP
        if: ${{ env.IIS_SMOKE_URL != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $response = Invoke-WebRequest -Uri $env:IIS_SMOKE_URL -UseBasicParsing
          if ($response.StatusCode -lt 200 -or $response.StatusCode -gt 299) {
            throw "Smoke URL returned status code $($response.StatusCode)."
          }

          if ($response.Content -notlike "*State: updated*") {
            throw "Smoke URL content verification failed."
          }

          "Smoke URL verification succeeded: $env:IIS_SMOKE_URL"
