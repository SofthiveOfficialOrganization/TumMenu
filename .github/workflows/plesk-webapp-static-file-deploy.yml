name: Plesk WebUI static file deploy

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Static file to upload under /tummenu.com/webapp"
        required: true
        default: "public-menu.css"
        type: choice
        options:
          - public-menu.css

concurrency:
  group: plesk-webapp-static-file-deploy
  cancel-in-progress: false

jobs:
  deploy-static-file:
    name: Upload one approved static file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select file
        shell: bash
        env:
          SELECTED_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          case "$SELECTED_FILE" in
            public-menu.css)
              echo "LOCAL_FILE=WebUI/wwwroot/css/public-menu.css" >> "$GITHUB_ENV"
              echo "REMOTE_SUBDIR=wwwroot/css" >> "$GITHUB_ENV"
              echo "REMOTE_FILE=public-menu.css" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported file: $SELECTED_FILE"
              exit 1
              ;;
          esac

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload selected static file
        shell: bash
        env:
          PLESK_FILE_HOST: ${{ secrets.PLESK_FILE_HOST }}
          PLESK_FILE_USERNAME: ${{ secrets.PLESK_FILE_USERNAME }}
          PLESK_FILE_PASSWORD: ${{ secrets.PLESK_FILE_PASSWORD }}
          PLESK_WEBAPP_REMOTE_DIR: ${{ secrets.PLESK_WEBAPP_REMOTE_DIR }}
          PLESK_FTP_SSL_FORCE: ${{ secrets.PLESK_FTP_SSL_FORCE }}
          PLESK_FTP_SSL_VERIFY: ${{ secrets.PLESK_FTP_SSL_VERIFY }}
        run: |
          set -euo pipefail

          : "${PLESK_FILE_HOST:?Missing PLESK_FILE_HOST secret}"
          : "${PLESK_FILE_USERNAME:?Missing PLESK_FILE_USERNAME secret}"
          : "${PLESK_FILE_PASSWORD:?Missing PLESK_FILE_PASSWORD secret}"
          : "${PLESK_WEBAPP_REMOTE_DIR:?Missing PLESK_WEBAPP_REMOTE_DIR secret}"
          : "${LOCAL_FILE:?Missing LOCAL_FILE}"
          : "${REMOTE_SUBDIR:?Missing REMOTE_SUBDIR}"
          : "${REMOTE_FILE:?Missing REMOTE_FILE}"

          test -f "$LOCAL_FILE"

          ssl_force="${PLESK_FTP_SSL_FORCE:-true}"
          ssl_verify="${PLESK_FTP_SSL_VERIFY:-true}"

          lftp -u "$PLESK_FILE_USERNAME","$PLESK_FILE_PASSWORD" "$PLESK_FILE_HOST" <<UPLOAD_FILE
          set ftp:ssl-force $ssl_force
          set ftp:ssl-protect-data true
          set ssl:verify-certificate $ssl_verify
          set net:max-retries 2
          set net:timeout 30
          cd "$PLESK_WEBAPP_REMOTE_DIR"
          cd "$REMOTE_SUBDIR"
          put "$LOCAL_FILE" -o "$REMOTE_FILE"
          cls -l "$REMOTE_FILE"
          bye
          UPLOAD_FILE
