name: Plesk WebUI guarded deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Plan lists the package only; deploy uploads it to Plesk"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - deploy
      run_tests:
        description: "Run WebUI test project before publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: plesk-webapp-guarded-deploy
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build and test WebUI
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore WebUI tests
        run: dotnet restore WebUI.IntegrationTests/WebUI.IntegrationTests.csproj

      - name: Build WebUI tests
        run: dotnet build WebUI.IntegrationTests/WebUI.IntegrationTests.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Test WebUI
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: dotnet test WebUI.IntegrationTests/WebUI.IntegrationTests.csproj --configuration "${{ env.CONFIGURATION }}" --no-build --verbosity normal

  package-and-deploy:
    name: Package and guarded deploy
    runs-on: ubuntu-latest
    needs: build-test-publish

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      CONFIGURATION: Release
      PUBLISH_DIR: WebUI/bin/Release/net8.0/publish

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore WebUI
        run: dotnet restore WebUI/WebUI.csproj

      - name: Publish WebUI
        run: dotnet publish WebUI/WebUI.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore /p:UseAppHost=false

      - name: Build protected deployment package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _deploy/package
          mkdir -p _deploy/package
          cp -a "${PUBLISH_DIR}/." _deploy/package/

          rm -rf \
            _deploy/package/web.config \
            _deploy/package/appsettings.json \
            _deploy/package/appsettings.Development.json \
            _deploy/package/appsettings.*.json \
            _deploy/package/location-api \
            _deploy/package/Location-api \
            _deploy/package/Logs \
            _deploy/package/logs \
            _deploy/package/wwwroot/uploads

          protected_found=0
          for protected_path in \
            web.config \
            appsettings.json \
            appsettings.Development.json \
            location-api \
            Logs \
            logs \
            wwwroot/uploads
          do
            if [ -e "_deploy/package/$protected_path" ]; then
              echo "Protected path still exists in package: $protected_path"
              protected_found=1
            fi
          done

          if [ "$protected_found" -ne 0 ]; then
            exit 1
          fi

          echo "Package file count:"
          find _deploy/package -type f | wc -l
          echo "Top-level package entries:"
          find _deploy/package -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
          echo "Protected paths excluded: web.config, appsettings*.json, location-api, Logs, logs, wwwroot/uploads"

          (cd _deploy/package && find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum) > _deploy/local-manifest.sha256

      - name: Stop before deploy in plan mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'plan' }}
        run: |
          echo "Plan mode complete. No files were uploaded to Plesk."

      - name: Install lftp
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload guarded package to Plesk
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        shell: bash
        env:
          PLESK_FILE_HOST: ${{ secrets.PLESK_FILE_HOST }}
          PLESK_FILE_USERNAME: ${{ secrets.PLESK_FILE_USERNAME }}
          PLESK_FILE_PASSWORD: ${{ secrets.PLESK_FILE_PASSWORD }}
          PLESK_WEBAPP_REMOTE_DIR: ${{ secrets.PLESK_WEBAPP_REMOTE_DIR }}
          PLESK_FTP_SSL_FORCE: ${{ secrets.PLESK_FTP_SSL_FORCE }}
          PLESK_FTP_SSL_VERIFY: ${{ secrets.PLESK_FTP_SSL_VERIFY }}
        run: |
          set -euo pipefail

          : "${PLESK_FILE_HOST:?Missing PLESK_FILE_HOST secret}"
          : "${PLESK_FILE_USERNAME:?Missing PLESK_FILE_USERNAME secret}"
          : "${PLESK_FILE_PASSWORD:?Missing PLESK_FILE_PASSWORD secret}"
          : "${PLESK_WEBAPP_REMOTE_DIR:?Missing PLESK_WEBAPP_REMOTE_DIR secret}"

          ssl_force="${PLESK_FTP_SSL_FORCE:-true}"
          ssl_verify="${PLESK_FTP_SSL_VERIFY:-true}"
          remote_manifest=".ci-cd-webui-manifest.sha256"

          set +e
          lftp -u "$PLESK_FILE_USERNAME","$PLESK_FILE_PASSWORD" "$PLESK_FILE_HOST" <<MANIFEST
          set ftp:ssl-force $ssl_force
          set ftp:ssl-protect-data true
          set ftp:use-site-chmod false
          set ssl:verify-certificate $ssl_verify
          set net:max-retries 2
          set net:timeout 30
          cd "$PLESK_WEBAPP_REMOTE_DIR"
          get "$remote_manifest" -o _deploy/remote-manifest.sha256
          bye
          MANIFEST
          manifest_status=$?
          set -e

          if [ "$manifest_status" -ne 0 ]; then
            echo "Previous deploy manifest was not found. A full guarded upload will run once."
            : > _deploy/remote-manifest.sha256
          fi

          sort _deploy/local-manifest.sha256 > _deploy/local-manifest.sorted
          sort _deploy/remote-manifest.sha256 > _deploy/remote-manifest.sorted
          comm -23 _deploy/local-manifest.sorted _deploy/remote-manifest.sorted > _deploy/changed-manifest.sha256
          cut -c 67- _deploy/changed-manifest.sha256 > _deploy/changed-files.txt

          changed_count="$(wc -l < _deploy/changed-files.txt | tr -d ' ')"
          echo "Changed package file count: $changed_count"

          if [ "$changed_count" -eq 0 ]; then
            echo "No deployable content changes were detected. Plesk upload skipped."
            exit 0
          fi

          rm -rf _deploy/changed-package
          mkdir -p _deploy/changed-package
          while IFS= read -r changed_file; do
            [ -n "$changed_file" ] || continue
            mkdir -p "_deploy/changed-package/$(dirname "$changed_file")"
            cp -a "_deploy/package/$changed_file" "_deploy/changed-package/$changed_file"
          done < _deploy/changed-files.txt

          cleanup_app_offline() {
            lftp -u "$PLESK_FILE_USERNAME","$PLESK_FILE_PASSWORD" "$PLESK_FILE_HOST" <<CLEANUP || true
          set ftp:ssl-force $ssl_force
          set ftp:ssl-protect-data true
          set ftp:use-site-chmod false
          set ssl:verify-certificate $ssl_verify
          set net:max-retries 2
          set net:timeout 30
          cd "$PLESK_WEBAPP_REMOTE_DIR"
          rm -f app_offline.htm
          bye
          CLEANUP
          }

          trap cleanup_app_offline EXIT

          cat > _deploy/app_offline.htm <<'OFFLINE'
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <meta http-equiv="refresh" content="60">
            <title>Tüm Menü güncelleniyor</title>
            <style>
              :root {
                --bg: #fcf4ee;
                --green: #688745;
                --green-light: #afc794;
                --ink: #3f3024;
                --white: #fffdf9;
              }

              * { box-sizing: border-box; }

              html,
              body {
                min-height: 100%;
                margin: 0;
              }

              body {
                display: grid;
                place-items: center;
                padding: 24px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background:
                  radial-gradient(circle at 18% 18%, rgba(175, 199, 148, 0.42), transparent 32%),
                  linear-gradient(180deg, var(--green), var(--green-light));
                color: #fff;
              }

              main {
                width: min(1040px, 100%);
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                align-items: center;
                gap: clamp(28px, 5vw, 64px);
              }

              @media (min-width: 860px) {
                main {
                  grid-template-columns: minmax(0, 1fr) minmax(280px, 0.76fr);
                }
              }

              .eyebrow {
                display: inline-flex;
                align-items: center;
                min-height: 32px;
                margin: 0 0 18px;
                padding: 6px 13px;
                border: 1px solid rgba(255, 255, 255, 0.24);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.14);
                color: rgba(255, 255, 255, 0.92);
                font-size: 13px;
                font-weight: 800;
              }

              h1 {
                margin: 0;
                color: var(--bg);
                font-size: clamp(42px, 7vw, 84px);
                font-weight: 850;
                line-height: 0.94;
                letter-spacing: 0;
              }

              h1 span {
                display: block;
                color: var(--ink);
              }

              p {
                max-width: 560px;
                margin: 24px 0 0;
                color: rgba(255, 255, 255, 0.94);
                font-size: clamp(17px, 2vw, 20px);
                font-weight: 600;
                line-height: 1.7;
              }

              .status {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 28px;
              }

              .pill {
                display: inline-flex;
                align-items: center;
                min-height: 42px;
                padding: 9px 15px;
                border: 1px solid rgba(255, 255, 255, 0.22);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.16);
                color: #fff;
                font-size: 14px;
                font-weight: 800;
              }

              .visual {
                position: relative;
                min-height: 300px;
                border-radius: 28px;
                background: rgba(255, 255, 255, 0.16);
                box-shadow: 0 24px 60px rgba(75, 58, 45, 0.18);
                overflow: hidden;
              }

              .board {
                position: absolute;
                inset: 34px;
                display: grid;
                gap: 14px;
                align-content: center;
              }

              .line {
                height: 18px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.72);
              }

              .line:nth-child(1) { width: 72%; }
              .line:nth-child(2) { width: 92%; }
              .line:nth-child(3) { width: 58%; }

              .progress {
                height: 12px;
                margin-top: 12px;
                overflow: hidden;
                border-radius: 999px;
                background: rgba(63, 48, 36, 0.18);
              }

              .progress::before {
                content: "";
                display: block;
                width: 62%;
                height: 100%;
                border-radius: inherit;
                background: linear-gradient(135deg, var(--white), #d7e3bf);
              }
            </style>
          </head>
          <body>
            <main>
              <section>
                <div class="eyebrow">Kısa bir güncelleme</div>
                <h1>Menüler <span>yenileniyor.</span></h1>
                <p>Tüm Menü'yü daha stabil ve hızlı hale getirmek için kısa bir bakım yapıyoruz. Lütfen birkaç dakika sonra tekrar deneyin.</p>
                <div class="status" aria-label="Güncelleme durumu">
                  <span class="pill">Tahmini süre: kısa</span>
                  <span class="pill">Sayfa otomatik yenilenir</span>
                </div>
              </section>
              <aside class="visual" aria-hidden="true">
                <div class="board">
                  <span class="line"></span>
                  <span class="line"></span>
                  <span class="line"></span>
                  <span class="progress"></span>
                </div>
              </aside>
            </main>
          </body>
          </html>
          OFFLINE

          lftp -u "$PLESK_FILE_USERNAME","$PLESK_FILE_PASSWORD" "$PLESK_FILE_HOST" <<DEPLOY
          set ftp:ssl-force $ssl_force
          set ftp:ssl-protect-data true
          set ftp:use-site-chmod false
          set ssl:verify-certificate $ssl_verify
          set net:max-retries 2
          set net:timeout 30
          cd "$PLESK_WEBAPP_REMOTE_DIR"
          put _deploy/app_offline.htm -o app_offline.htm
          mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob "web.config" --exclude-glob "appsettings*.json" --exclude-glob "location-api/**" --exclude-glob "Logs/**" --exclude-glob "logs/**" --exclude-glob "wwwroot/uploads/**" _deploy/changed-package/ .
          put _deploy/local-manifest.sha256 -o "$remote_manifest"
          rm -f app_offline.htm
          bye
          DEPLOY
