name: Plesk WebUI build test

on:
  workflow_dispatch:
    inputs:
      deploy_marker:
        description: "Upload only ci-cd-build-marker.txt to the WebUI folder"
        required: true
        default: false
        type: boolean
      run_tests:
        description: "Run WebUI test project before publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: plesk-webapp-build-test
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Build, test, and publish WebUI
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      CONFIGURATION: Release
      PUBLISH_DIR: WebUI/bin/Release/net8.0/publish

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore WebUI tests
        run: dotnet restore WebUI.IntegrationTests/WebUI.IntegrationTests.csproj

      - name: Build WebUI tests
        run: dotnet build WebUI.IntegrationTests/WebUI.IntegrationTests.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Test WebUI
        if: ${{ inputs.run_tests }}
        run: dotnet test WebUI.IntegrationTests/WebUI.IntegrationTests.csproj --configuration "${{ env.CONFIGURATION }}" --no-build --verbosity normal

      - name: Publish WebUI
        run: dotnet publish WebUI/WebUI.csproj --configuration "${{ env.CONFIGURATION }}" --no-restore /p:UseAppHost=false

      - name: Upload publish output for inspection
        uses: actions/upload-artifact@v5
        with:
          name: webui-publish-output
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 3

  upload-marker:
    name: Upload marker file only
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: ${{ inputs.deploy_marker }}

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload WebUI marker file only
        shell: bash
        env:
          PLESK_FILE_HOST: ${{ secrets.PLESK_FILE_HOST }}
          PLESK_FILE_USERNAME: ${{ secrets.PLESK_FILE_USERNAME }}
          PLESK_FILE_PASSWORD: ${{ secrets.PLESK_FILE_PASSWORD }}
          PLESK_WEBAPP_REMOTE_DIR: ${{ secrets.PLESK_WEBAPP_REMOTE_DIR }}
          PLESK_FTP_SSL_FORCE: ${{ secrets.PLESK_FTP_SSL_FORCE }}
          PLESK_FTP_SSL_VERIFY: ${{ secrets.PLESK_FTP_SSL_VERIFY }}
        run: |
          set -euo pipefail

          : "${PLESK_FILE_HOST:?Missing PLESK_FILE_HOST secret}"
          : "${PLESK_FILE_USERNAME:?Missing PLESK_FILE_USERNAME secret}"
          : "${PLESK_FILE_PASSWORD:?Missing PLESK_FILE_PASSWORD secret}"
          : "${PLESK_WEBAPP_REMOTE_DIR:?Missing PLESK_WEBAPP_REMOTE_DIR secret}"

          ssl_force="${PLESK_FTP_SSL_FORCE:-true}"
          ssl_verify="${PLESK_FTP_SSL_VERIFY:-true}"

          mkdir -p .deploy
          {
            echo "TumMenu WebUI build marker"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            date -u +"UTC: %Y-%m-%dT%H:%M:%SZ"
          } > .deploy/ci-cd-build-marker.txt

          lftp -u "$PLESK_FILE_USERNAME","$PLESK_FILE_PASSWORD" "$PLESK_FILE_HOST" <<UPLOAD_MARKER
          set ftp:ssl-force $ssl_force
          set ftp:ssl-protect-data true
          set ssl:verify-certificate $ssl_verify
          set net:max-retries 2
          set net:timeout 30
          cd "$PLESK_WEBAPP_REMOTE_DIR"
          put .deploy/ci-cd-build-marker.txt -o ci-cd-build-marker.txt
          cls -l ci-cd-build-marker.txt
          bye
          UPLOAD_MARKER
